[package]
name = "brepper"
version = "0.1.0"
edition = "2021"

[dependencies]
opencascade-sys = { path = "../opencascade-rs/crates/opencascade-sys" }
clap = { version = "4", features = ["derive"] }
levenberg-marquardt = "0.14"
nalgebra = "0.33"
three-d = "0.17"

[lib]
name = "brepper"
path = "src/lib.rs"

[[bin]]
name = "brepper"
path = "src/bin/brepper.rs"

[[bin]]
name = "step-measure-tolerance"
path = "src/bin/step_measure_tolerance.rs"


[[bin]]
name = "viewer"
path = "src/bin/viewer.rs"

# Optimize numerics-heavy dependencies even in dev builds.
# Without this, nalgebra/levenberg-marquardt are ~35x slower in debug mode
# due to bounds checking, shape queries, and deep un-inlined call chains.
[profile.dev]
opt-level = 1

[profile.dev.package.nalgebra]
opt-level = 3

[profile.dev.package.levenberg-marquardt]
opt-level = 3

[profile.dev.package.simba]
opt-level = 3